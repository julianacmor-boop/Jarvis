name: Atualizar agenda

on:
  schedule:
    # 05:00, 11:00 e 17:00 no horário de Brasília
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install cryptography

      - name: Baixar e criptografar a agenda
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          AGENDA_PASS: ${{ secrets.AGENDA_PASS }}
        run: python scripts/update_agenda.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.enc.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza agenda"
            git push
          fi
